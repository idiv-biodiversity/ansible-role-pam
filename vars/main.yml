---

# -----------------------------------------------------------------------------
# distro / os handles
# -----------------------------------------------------------------------------

__pam_distro: >-
  {{ ansible_facts.distribution | lower }}

__pam_os: >-
  {{ ansible_facts.os_family | lower }}

__pam_distro_version: >-
  {{ __pam_distro }}_{{ ansible_facts.distribution_major_version }}

__pam_os_version: >-
  {{ __pam_os }}_{{ ansible_facts.distribution_major_version }}

# -----------------------------------------------------------------------------
# first found snippets
# -----------------------------------------------------------------------------

__pam_first_found:
  - '{{ __pam_distro_version }}'
  - '{{ __pam_os_version }}'
  - '{{ __pam_distro }}'
  - '{{ __pam_os }}'
  - default

__pam_vars_files:
  files: >-
    {{
      __pam_first_found |
        map('regex_replace', '$', '.yml') |
        list
    }}
  paths:
    - vars

...
